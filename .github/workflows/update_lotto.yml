name: Auto Update Lotto Numbers

on:
  schedule:
    # 매주 토요일 KST 21:15 (UTC 12:15)
    - cron: '15 12 * * 6'
    # 재시도 1: KST 21:45 (UTC 12:45)
    - cron: '45 12 * * 6'
    # 재시도 2: KST 22:30 (UTC 13:30)
    - cron: '30 13 * * 6'
  workflow_dispatch: # 수동 즉시 실행 지원

permissions:
  contents: write

jobs:
  update-lotto-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Weekly Update
        id: update_script
        run: node scripts/update_weekly.js

      - name: Commit & Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/lotto_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update lotto draw data [skip ci]" && git push)
