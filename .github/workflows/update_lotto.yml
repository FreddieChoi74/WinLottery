name: Auto Update Lotto & Deploy

on:
  schedule:
    # 매주 토요일 KST 21:15 (UTC 12:15)
    - cron: '15 12 * * 6'
    # 재시도 1: KST 21:45 (UTC 12:45)
    - cron: '45 12 * * 6'
    # 재시도 2: KST 22:30 (UTC 13:30)
    - cron: '30 13 * * 6'
  workflow_dispatch: # 수동 즉시 실행 지원

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Weekly Update
        id: update_script
        run: node scripts/update_weekly.js

      - name: Commit & Push Changes
        id: git_push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/lotto_history.json
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No data changes detected."
          else
            git commit -m "chore(data): auto-update lotto draw data"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Pages
        if: steps.git_push.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        if: steps.git_push.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install

      - name: Build project
        if: steps.git_push.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Upload artifact
        if: steps.git_push.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: steps.git_push.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
